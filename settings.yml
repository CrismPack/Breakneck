export_client: True
export_server: False

refresh_only: False
update_bcc_version: True
cleanup_temp: True
create_release_notes: True
server_mods_remove_list: []
print_path_debug: False
update_publish_workflow: True
download_comparison_files: True
generate_primary_changelog: True
generate_mods_changelog: True
update_crash_assistant_modlist: True  # Write the crash-assistant modlist during export.
# Legacy compatibility preset. If True, missing modular flags below are auto-enabled.
breakneck_fixes: True
client_export_multi_platform: True
client_export_format: "curseforge" # Single-platform export target when client_export_multi_platform is False: "curseforge" or "modrinth".
show_export_mode_notice: True
changelog_template_use_overview_layout: True
changelog_include_compare_notice: True
comparison_files_use_versioned_packwiz_root: True
github_auth: False
changelog_side_tag: False
changelog_updated_mods: False # Include an "Updated Mods" section in the changelog.
changelog_updated_resourcepacks: False # Include an "Updated Resource Packs" section in the changelog.
modlist_side_tag: False
migrate_minecraft_version: False
migration_target_minecraft: "" # Example: "1.21.12"
migration_target_fabric: "" # Optional. Leave empty to keep current Fabric loader version.
migration_target_mod_loader: "" # Optional. Defaults to current loader. Supported: fabric/quilt/forge/neoforge.
migration_target_mod_loader_version: "" # Required when switching loaders.
migration_mod_loader: "fabric" # Compatibility-check loader. Leave as-is unless you need an override.
alpha_update_policy: "prompt" # "prompt" or "always_skip"
migration_update_all_mods: True
migration_disable_incompatible_mods: True
mc_prefixed_versions: True  # Opt-in "<mc>-<release>" version scheme, e.g. "26.2-1.0". Release resets per MC version; pre-releases append "-beta.N". Only affects prompt defaults; sorting handles both schemes automatically.
auto_generate_update_overview: True
auto_summary_overwrite_existing: True
auto_generate_config_changes: True
auto_config_overwrite_existing: True
auto_config_include_removed_files: True # Set False to hide removed config-file bullets from Config Changes.
auto_config_provider: "ollama"
auto_config_model: "qwen3:4b-instruct"
auto_config_endpoint: "http://127.0.0.1:11434/api/generate"
auto_config_timeout_seconds: 45
auto_config_temperature: 0.25
auto_config_max_items: 20
auto_config_max_lines: 18
comparison_files_versioned_root_pattern: "Packwiz/{mc_version}" # Available placeholders: {mc_version}, {version}
comparison_files_versioned_root_min_version: "4.0.0-beta.3"
comparison_files_versioned_root_max_version: "4.4.0-beta.1"

bh_banner: "https://raw.githubusercontent.com/CrismPack/CDN/refs/heads/main/desc/breakneck/bh.png"

