# Settings for HaXr's Modpack Tool, one file per modpack project.
# The tool keeps this file in the template's layout and preserves your values.

# Packs that "Build release" creates: any of curseforge, modrinth, server.
exports: [curseforge, modrinth]

# Mods to leave out of only the CurseForge or only the Modrinth pack (slug, name or filename).
# For example, a mod that isn't on that platform and whose license doesn't allow bundling it.
curseforge_exclude: [voxy-worldgen]
modrinth_exclude: []

# Server pack: the folder copied into it (start scripts, server configs, extra jars in mods/)
# and the mods to leave out (slug, name or jar filename).
server_template: "Server Pack"
server_exclude: []

# Suggest "<minecraft>-<release>" versions such as 26.2-1.0 when bumping or migrating.
mc_prefixed_versions: True

# Pre-releases (versions such as 26.2-1.0-beta.1 or 2.2.0-alpha.1):
#   standalone: releases like any other, marked as possibly less stable or feature complete.
#     Every release lists what changed since the release before it.
#   previews: previews of their full release, which covers them all. It's compared with the
#     previous full release, and its changelog starts with their notes.
prereleases: "standalone"

# When an update lands on an alpha version: prompt, never (redirect or revert), or always (keep it).
alpha_updates: "prompt"

# Show `Client` / `Server` after mod names in changelogs and modlist.md.
side_tags: False

# "Full changelog" link in the release notes.
# Placeholders: {mc_group} (content update, e.g. 26.2 or 1.21), {mc}, {version}, {anchor}.
changelog_url: "https://crismpack.net/breakneck/changelogs/{mc_group}#{anchor}"

# Markdown appended to the release notes, e.g. a sponsor banner.
curseforge_notes_footer: |
  <br>

  [![BisectHosting Banner](https://raw.githubusercontent.com/CrismPack/CDN/refs/heads/main/desc/breakneck/bh.png)](https://bisecthosting.com/CRISM)
modrinth_notes_footer: ""
