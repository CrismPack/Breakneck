name: Automatically publish to Modrinth and CurseForge

on:
  release:
    types: [published]

env:
  MODRINTH_TOKEN: ${{secrets.MODRINTH_TOKEN}}
  CURSEFORGE_TOKEN: ${{secrets.CURSEFORGE_TOKEN}}
  GITHUB_TOKEN: ${{secrets.PUBLISH_GITHUB_TOKEN}}
  # Everything else comes from the release itself, so nothing in this file
  # needs editing before a release.
  TAG: ${{github.event.release.tag_name}}
permissions:
  contents: write

jobs:
  publish-to-curseforge:
    if: github.repository_owner == 'CrismPack'
    runs-on: ubuntu-24.04
    environment: github-actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read the Minecraft version from pack.toml
        run: echo "MC_VERSION=$(grep -m1 '^minecraft = ' Packwiz/pack.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Download pack files
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{env.TAG}}
          fileName: '*.zip'
          tarBall: false
          zipBall: false

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: Breakneck v${{env.TAG}} for ${{env.MC_VERSION}}
          changelog-file: CurseForge-Release.md

          curseforge-id: 579074
          curseforge-token: ${{env.CURSEFORGE_TOKEN}}
          curseforge-files: '*.zip'

          loaders: fabric
          game-versions: ${{env.MC_VERSION}}


  publish-to-modrinth:
    if: github.repository_owner == 'CrismPack'
    runs-on: ubuntu-24.04
    environment: github-actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read the Minecraft version from pack.toml
        run: echo "MC_VERSION=$(grep -m1 '^minecraft = ' Packwiz/pack.toml | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Download pack files
        uses: robinraju/release-downloader@v1.11
        with:
          tag: ${{env.TAG}}
          fileName: '*.mrpack'
          tarBall: false
          zipBall: false

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          name: Breakneck v${{env.TAG}} for ${{env.MC_VERSION}}
          changelog-file: Modrinth-Release.md

          modrinth-id: qPrWu8wn
          modrinth-featured: false
          modrinth-token: ${{env.MODRINTH_TOKEN}}
          modrinth-files: '*.mrpack'

          loaders: fabric
          game-versions: ${{env.MC_VERSION}}
