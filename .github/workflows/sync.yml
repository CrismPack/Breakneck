name: Sync Files
on:
  push:
    # Only main and maintenance branches (named after their Minecraft version,
    # like 1.21.11) publish release data; other branches wait for their merge.
    branches:
      - main
      - '[0-9]*'
    paths:
      - 'Changelogs/data/**'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@main
      - name: Run GitHub File Sync
        uses: BetaHuhn/repo-file-sync-action@v1
        with:
          GH_PAT: ${{ secrets.GH_PAT }}